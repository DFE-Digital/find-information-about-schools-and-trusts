name: .NET

on:
  pull_request:
    branches: [ main, 'feature/**' ]
    paths:
      - '**.cs'
      - '**.cshtml'
      - '**.sql'
      - '**.csproj'
      - '**.sln'
      - '**/appsettings*json'
      - '.config/dotnet-tools.json'
      - 'stryker-config.json'
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/dotnet/sdk:10.0@sha256:8a90a473da5205a16979de99d2fc20975e922c68304f5c79d564e666dc3982fc
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install other dotnet tools (including stryker, code coverage and entity framework cli)
      run: dotnet tool restore

    - name: Add nuget package source
      run: dotnet nuget add source --username USERNAME --password $GH_TOKEN --store-password-in-clear-text --name github "https://nuget.pkg.github.com/DFE-Digital/index.json"

    - name: Build solution
      run: |
        dotnet restore DfE.FindInformationAcademiesTrusts
        dotnet build DfE.FindInformationAcademiesTrusts -c Release

    - name: Ensure there are no pending migrations
      run: dotnet ef migrations has-pending-model-changes --context FiatDbContext --project DfE.FindInformationAcademiesTrusts.Data.FiatDb --startup-project DfE.FindInformationAcademiesTrusts

    - name: Run tests
      run: dotnet test DfE.FindInformationAcademiesTrusts.sln
